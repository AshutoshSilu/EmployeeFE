<div class="login-container">
  <app-header></app-header>
  
  <main class="main-content">
    <div class="login-card">
      <div class="login-header">
        <h2>Welcome Back</h2>
        <p>Please sign in to your account</p>
      </div>
      
      <form class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" [(ngModel)]="username" name="username" placeholder="Enter your username" />
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" [(ngModel)]="password" name="password" type="password" placeholder="Enter your password" />
        </div>
        
        <div *ngIf="error" class="error-message">
          {{error}}
        </div>
        
        <div class="form-actions">
          <button type="button" (click)="login()" [disabled]="isLoading" class="btn-primary">
            <span *ngIf="isLoading">Signing In...</span>
            <span *ngIf="!isLoading">Sign In</span>
          </button>
          <button type="button" (click)="goBack()" [disabled]="isLoading" class="btn-secondary">Back</button>
        </div>
      </form>
    </div>
  </main>
  
  <app-footer></app-footer>
</div>
