<app-header></app-header>
<div class="checkout-container">
  <div class="checkout-header">
    <h1>Checkout</h1>
    <p>Complete your order</p>
  </div>
  
  <div class="checkout-content">
    <div class="address-section">
      <h2>Delivery Address</h2>
      <form class="address-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
        </div>
        
        <div class="form-group">
          <label for="address">Address</label>
          <textarea id="address" class="form-control" rows="3" placeholder="Enter your complete address" required></textarea>
        </div>
        
        <div class="form-group">
          <label for="pincode">Pincode</label>
          <input type="text" id="pincode" class="form-control" placeholder="Enter pincode" maxlength="6" required>
        </div>
        
        <div class="form-group">
          <label for="location">Location</label>
          <div class="location-input">
            <input type="text" id="location" class="form-control" placeholder="Enter location or use current location" required>
            <button type="button" class="location-btn" (click)="getCurrentLocation()">
              📍 Use Current Location
            </button>
          </div>
        </div>
      </form>
    </div>
    
    <div class="order-summary">
      <h3>Order Summary</h3>
      <div class="summary-items">
        @for (item of orderItems; track item.id) {
        <div class="summary-item">
          <span class="item-name">{{ item.name }} x{{ item.quantity }}</span>
          <span class="item-price">₹{{ item.price * item.quantity }}</span>
        </div>
        }
      </div>
      <div class="summary-total">
        <h3>Total: ₹{{ orderTotal }}</h3>
      </div>
      <button class="btn btn-primary place-order-btn" (click)="placeOrder()">Place Order</button>
    </div>
  </div>
</div>
<app-footer></app-footer>
