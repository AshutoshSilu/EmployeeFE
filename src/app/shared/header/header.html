<header class="header">
  <div class="header-container">
    <div class="header-left">
      <div class="logo" (click)="home()">
        <img src="assets/img/MOM.png" alt="Mom's Magic Logo">
        <span class="logo-text">Mom’s Magic <br>Mealbox</span>
      </div>
      <nav class="nav-links" [class.active]="isMenuOpen()">
        <a href="#" class="nav-link">
          <span (click)="toggleMenu()" class="nav-icon">🍽️</span>
          Menu
        </a>
        <a href="#" class="nav-link" (click)="scrollToContact($event)">
          <span class="nav-icon">📞</span>
          Contact Us
        </a>
        <a href="#" class="nav-link" (click)="navigateToOrderNow($event)">
          <span class="nav-icon">🛒</span>
          Order Now
        </a>
        @if (isLoggedIn()) {
        <a href="#" class="nav-link" (click)="navigateToTrackOrder($event)">
          <span class="nav-icon">📦</span>
          Track Order
        </a>
        <a href="#" class="nav-link" (click)="navigateToCustomerDashboard($event)">
          <span class="nav-icon">🍽️</span>
          Meal Packages
        </a>
        }
        <a href="#" class="nav-link" (click)="navigateToEmployeePortal($event)">
          <span class="nav-icon">💼</span>
          Employee Portal
        </a>
        <a href="#" class="nav-link" (click)="navigateToOffers($event)">
          <span class="nav-icon">🎉</span>
          Offers
        </a>
      </nav>
    </div>

    <div class="header-right">
      <button class="auth-btn registration-btn" (click)="navigateToRegistration()">
        <span class="btn-icon">📝</span>
        Registration
      </button>
      @if (!isLoggedIn()) {
      <button class="auth-btn login-btn" (click)="navigateToLogin()">
        <span class="btn-icon">🔐</span>
        Login
      </button>
      }
      @if (isLoggedIn()) {
      <button class="auth-btn logout-btn" (click)="logout()">
        <span class="btn-icon">🚪</span>
        Logout
      </button>
      }
    </div>
  </div>
  <div class="header-glow"></div>
</header>

<!-- Login Popup -->
@if (showLoginPopup()) {
<div class="login-overlay">
  <div class="modal-backdrop" (click)="closeLoginPopup()"></div>
  <div class="login-popup-wrapper">
    <app-login-popup (closeLogin)="closeLoginPopup()"></app-login-popup>
  </div>
</div>
}

<!-- Contact Popup -->
@if (showContactPopup()) {
<div class="contact-overlay">
  <div class="modal-backdrop" (click)="closeContactPopup()"></div>
  <div class="contact-popup-wrapper">
    <div class="popup-header">
      <h3>Contact Us</h3>
      <button class="close-btn" (click)="closeContactPopup()">&times;</button>
    </div>
    <app-contact-us></app-contact-us>
  </div>
</div>
}
