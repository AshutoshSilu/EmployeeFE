<div class="contact-section" id="contact">
    <div class="container">
      <h2 class="section-title">Contact Us</h2>
      <div class="contact-grid">
        <div class="contact-info">
          <div class="contact-item">
            <div class="contact-icon">📍</div>
            <h3>Address</h3>
            <p>354/4, Berhampur<br>Ganjam, 760001</p>
          </div>
          <div class="contact-item">
            <div class="contact-icon">📞</div>
            <h3>Phone</h3>
            <p>+91 993798895</p>
          </div>
          <div class="contact-item">
            <div class="contact-icon">✉️</div>
            <h3>Email</h3>
            <p>info@momsmagic.com</p>
          </div>
        </div>
        <div class="contact-form">
          <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
              <input 
                type="text" 
                class="form-control" 
                placeholder="Your Name" 
                formControlName="name"
                [class.is-invalid]="contactForm.get('name')?.invalid && contactForm.get('name')?.touched">
              <div class="invalid-feedback" *ngIf="getFieldError('name')">
                {{ getFieldError('name') }}
              </div>
            </div>
            <div class="form-group">
              <input 
                type="email" 
                class="form-control" 
                placeholder="Your Email" 
                formControlName="email"
                [class.is-invalid]="contactForm.get('email')?.invalid && contactForm.get('email')?.touched">
              <div class="invalid-feedback" *ngIf="getFieldError('email')">
                {{ getFieldError('email') }}
              </div>
            </div>
            <div class="form-group">
              <textarea 
                class="form-control" 
                rows="4" 
                placeholder="Your Message" 
                formControlName="message"
                [class.is-invalid]="contactForm.get('message')?.invalid && contactForm.get('message')?.touched"></textarea>
              <div class="invalid-feedback" *ngIf="getFieldError('message')">
                {{ getFieldError('message') }}
              </div>
            </div>
            <button 
              type="submit" 
              class="btn btn-primary" 
              [disabled]="isSubmitting || !contactForm.valid">
              {{ isSubmitting ? 'Sending...' : 'Send Message' }}
            </button>
            <div class="mt-3" *ngIf="submitMessage">
              <div class="alert" [class.alert-success]="isSuccess" [class.alert-danger]="!isSuccess">
                {{ submitMessage }}
              </div>
            </div>
          </form>
        </div>
      </div>
