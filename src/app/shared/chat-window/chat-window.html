<!-- Chat Bubble -->
<div class="chat-bubble" (click)="toggleChat()" [class.active]="isOpen">
  <div class="chat-icon">💬</div>
  <div class="notification-dot" *ngIf="!isOpen && unreadCount() > 0">
    <span class="unread-count" *ngIf="unreadCount() > 0">{{ unreadCount() }}</span>
  </div>
</div>

<!-- Chat Window -->
<div class="chat-container" [class.open]="isOpen" *ngIf="isOpen">
  <div class="chat-header">
    <div class="chat-title">
      <span class="status-dot"></span>
      Customer Support
    </div>
    <button class="close-btn" (click)="closeChat()">×</button>
  </div>
  
  <div class="chat-messages">
    <div 
      class="message" 
      *ngFor="let message of messages()"
      [class.user-message]="message.sender === 'user'"
      [class.support-message]="message.sender === 'support'">
      <div class="message-content">
        {{ message.text }}
      </div>
      <div class="message-time">
        {{ message.timestamp | date:'short' }}
      </div>
    </div>
  </div>
  
  <div class="chat-input">
    <input 
      type="text" 
      [(ngModel)]="newMessage"
      (keypress)="onKeyPress($event)"
      placeholder="Type your message..."
      class="message-input">
    <button class="send-btn" (click)="sendMessage()" [disabled]="!newMessage.trim()">
      Send
    </button>
  </div>
</div>
