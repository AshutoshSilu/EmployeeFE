<div class="registration-page">
  <div class="registration-container">
    <div class="header">
      <button class="back-btn" (click)="goBack()">← Back</button>
      <h1>Customer Registration</h1>
      <p>Register to subscribe to our meal packages</p>
    </div>

    <form class="registration-form" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input 
            type="text" 
            [(ngModel)]="customerData.firstName" 
            name="firstName" 
            required>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input 
            type="text" 
            [(ngModel)]="customerData.lastName" 
            name="lastName" 
            required>
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          [(ngModel)]="customerData.email" 
          name="email" 
          required>
      </div>

      <div class="form-group">
        <label>Mobile</label>
        <input 
          type="tel" 
          [(ngModel)]="customerData.mobile" 
          name="mobile" 
          required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input 
          type="password" 
          [(ngModel)]="customerData.password" 
          name="password" 
          required>
      </div>

      <button type="submit" class="register-btn" [disabled]="!isFormValid()">
        Register Now
      </button>
    </form>
  </div>
</div>
